name: Starter CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / PHP 8.1
            os: ubuntu-latest
            php: '8.1'
          - name: Linux / PHP 8.5
            os: ubuntu-latest
            php: '8.5'
          - name: Windows / PHP 8.5
            os: windows-latest
            php: '8.5'

    steps:
      - name: Check out starter
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, pdo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install published dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Show installed Framework 0.2 package
        run: composer show meulah/framework --no-interaction

      - name: Regenerate application autoloading
        run: composer dump-autoload --optimize --no-interaction

      - name: Verify production-only installation
        run: composer install --no-interaction --prefer-dist --no-dev --classmap-authoritative

      - name: Lint application PHP
        run: composer lint

      - name: Run application smoke tests
        run: composer test
